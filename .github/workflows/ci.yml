name: Public beta checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Keep browser/system dependencies compatible with the locked Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seekerhub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seekerhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seekerhub_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seekerhub_test
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: seekerhub-builds
      S3_ACCESS_KEY_ID: ci-minio-access
      S3_SECRET_ACCESS_KEY: ci-minio-secret
      S3_FORCE_PATH_STYLE: "true"
      SOLANA_RPC_URL: http://127.0.0.1:8899
      NEXT_PUBLIC_SOLANA_RPC_URL: http://127.0.0.1:8899
      NEXT_PUBLIC_SEEKER_RELAY_DOMAIN: ""
      NEXT_PUBLIC_ENABLE_SEEKER_CONNECT: "false"
      RESEND_API_KEY: re_ci_only
      EMAIL_FROM: "SeekerHub CI <ci@example.com>"
      EMAIL_REPLY_TO: ci@example.com
      INVITE_ENCRYPTION_KEY: ci-only-invite-encryption-key-000000000000
      RATE_LIMIT_SALT: ci-only-rate-limit-salt-000000000000
      ADMIN_EMAILS: admin@example.com
      CRON_SECRET: ci-only-cron-secret-0000000000000000
      RUN_INTEGRATION_TESTS: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start private object storage
        run: |
          docker run --detach --name seekerhub-minio --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=ci-minio-access \
            --env MINIO_ROOT_PASSWORD=ci-minio-secret \
            sourcemation/minio:RELEASE.2025-10-15T17-29-55Z@sha256:e1c92c5362c5e0d9a5cf5c6fd11e5c6f72fbcc7bdfd6fad94d0a3eb12784ba9a server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs seekerhub-minio
          exit 1
      - run: npm run db:migrate:deploy
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:artifact
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
